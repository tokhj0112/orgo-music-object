<!doctype html>
<html lang="ko" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" content="notranslate">
  <title>ORGO — 수동 오르골 연주</title>
  <link rel="stylesheet" href="player.css?v=classic-crank-163">
  <script src="player.js?v=manual-player-162" defer></script>
</head>

<body class="archive-player-page">
  <header class="player-header">
    <a class="player-logo" href="index.html" aria-label="ORGO 홈">orgo<sup>®</sup></a>
    <a class="back-link" href="archive.html">아카이브로 돌아가기</a>
  </header>

  <main class="player-main">
    <section class="player-intro" aria-labelledby="player-title">
      <p class="player-eyebrow">저장된 멜로디 / 수동 연주</p>
      <h1 id="player-title">저장된 멜로디</h1>
      <p id="player-description" class="player-description">
        손잡이를 시계 방향으로 돌리면 저장한 악보가 오르골 안으로 이동하며 한 음씩 연주됩니다.
      </p>

      <div class="player-settings" aria-label="오르골 설정">
        <label class="player-select">
          <span>음색</span>
          <select id="player-tone" aria-label="오르골 음색">
            <option value="bright">맑은 별빛 · 선명한 고음</option>
            <option value="warm">따뜻한 숲 · 균형 잡힌 울림</option>
            <option value="soft">밤의 자장가 · 부드러운 여운</option>
          </select>
        </label>
        <label class="player-volume">
          <span>음량</span>
          <input id="player-volume" type="range" min="0" max="100" value="65" aria-label="음량">
        </label>
      </div>
    </section>

    <section id="player-machine" class="player-machine" aria-label="수동 오르골 연주 장치">
      <div class="feed-window">
        <canvas id="player-feed" width="960" height="180" aria-label="오르골 안으로 이동하는 저장 악보"></canvas>
        <span>악보 이동</span>
      </div>
      <div class="player-crank-area">
        <button id="player-crank" type="button" aria-label="오르골 손잡이를 시계 방향으로 돌려 연주하기">
          <span class="crank-shadow"></span>
          <span class="crank-axle"></span>
          <span class="crank-arm"><span class="crank-knob"></span></span>
        </button>
        <p id="player-status">손잡이를 잡고 시계 방향으로 천천히 돌려보세요.</p>
      </div>
      <div class="machine-footer">
        <span id="player-progress">준비 / 0%</span>
        <button id="player-rewind" type="button" aria-label="처음으로 되감기" title="처음으로 되감기">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 4v6h6"></path>
            <path d="M5.6 15.2a7.5 7.5 0 1 0 .6-7.4L4 10"></path>
          </svg>
        </button>
      </div>
    </section>

    <section class="saved-paper" aria-labelledby="saved-paper-title">
      <div class="saved-paper-head">
        <span id="saved-paper-title">저장된 악보</span>
        <span id="paper-meta">아카이브 / ORGO</span>
      </div>
      <canvas id="player-sheet" width="1200" height="460" aria-label="저장된 손글씨 악보"></canvas>
      <span class="sheet-rule" aria-hidden="true"></span>
    </section>
  </main>
</body>
</html>
